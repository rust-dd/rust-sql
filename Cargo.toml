[workspace]
members = ["crates/rsql-tauri", "crates/rsql-core", "crates/rsql-proxy"]
resolver = "3"

[workspace.package]
version = "1.1.5"
edition = "2024"
authors = ["rust-dd"]
description = "Modern SQL Client"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
tokio = "1.47.1"
tokio-postgres = "0.7.13"
deadpool-postgres = "0.14.1"
postgres-native-tls = "0.5"
native-tls = "0.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
libsql = "0.9.29"
thiserror = "2"
portable-pty = "0.9.0"
rayon = "1.11.0"
sysinfo = "0.38.3"
csv = "1.3"
futures-util = "0.3"
russh = "0.57"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower = "0.5"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
